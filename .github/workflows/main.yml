name: Deploy Next.js via WebDeploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm run build

      - name: Create Deployment Package
        run: |
          mkdir deploy_package
          
          # Copy EVERYTHING from standalone to the package root
          # This includes the standalone server.js and its internal node_modules
          xcopy /E /I .next\standalone deploy_package\
          
          # Copy the static assets into the correct subfolder
          mkdir deploy_package\.next\static
          xcopy /E /I .next\static deploy_package\.next\static
          
          # Copy public folder
          xcopy /E /I public deploy_package\public
          
          # Copy the web.config to the ROOT of deploy_package
          copy web.config deploy_package\
          
      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: deploy_package 
          target-path: /
          target-delete: true # Clean up old files to ensure standalone structure is correct
