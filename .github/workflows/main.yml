name: Deploy Next.js via WebDeploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20 # Upgrading to 20 is highly recommended for Next.js 15/Tailwind 4
          cache: 'npm'

      - name: Install dependencies
        # --foreground-scripts ensures native builds (like oxide) show logs and complete properly
        run: npm ci --foreground-scripts

      - name: Build Next.js
        # One build command is enough. It generates the /out folder.
        run: npm run build

      - name: Create Deployment Package
        # We copy only what is needed to run: .next, public, next.config, package.json, and your server files
        run: |
          mkdir deploy_package
          xcopy /E /I .next deploy_package\.next
          xcopy /E /I public deploy_package\public
          copy package.json deploy_package\
          copy package-lock.json deploy_package\
          copy next.config.ts deploy_package\
          copy server.js deploy_package\
          copy web.config deploy_package\

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: deploy_package  # No more dots, use the explicit folder name
          target-path: /
          target-delete: false
