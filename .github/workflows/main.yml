name: Build and Deploy React App to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout
        uses: actions/checkout@v3

      # 2️⃣ Setup Node for React
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'   # or 20 if your project supports it

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build React app
      - name: Build React app
        run: npm run build

      # 5️⃣ Deploy to MonsterASP via FTP
      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./build/        # React build output
          server-dir: /wwwroot/      # MonsterASP site root
          protocol: ftp
          port: 21
          passive: true
          git-ftp-args: --all --delete   # clean & upload
