name: Deploy Next.js to MonsterASP.NET

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest  # Must be Windows if using WebDeploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build & Export Next.js
        run: |
          npm run build
          npm run export

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: out        # ✅ Use Next.js exported folder
          target-path: /wwwroot   # MonsterASP.NET root folder
          target-delete: true
